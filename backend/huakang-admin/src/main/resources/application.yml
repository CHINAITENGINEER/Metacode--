  secret: huakang-electronics-test-secret-key-2024
  expiration: 7200000 # 2小时（毫秒）

# 应用配置
server:
  port: ${TEST_SERVER_PORT:8080}
  servlet:
    context-path: /api/admin

# 日志配置
