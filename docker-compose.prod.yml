version: '3.8'

# 华康电器连锁积分小程序 - 生产环境部署配置

services:
  mysql:
    image: mysql:8.0
    container_name: hk-mysql-prod
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_USER: ${DB_USERNAME}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      TZ: Asia/Shanghai
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./database_init_enterprise_fixed.sql:/docker-entrypoint-initdb.d/001_init.sql:ro
      - ./my.cnf:/etc/mysql/conf.d/my.cnf:ro
    command: >
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_unicode_ci
      --default-time-zone=+08:00
      --max_connections=500
      --innodb_buffer_pool_size=1G
      --slow_query_log=1
      --slow_query_log_file=/var/lib/mysql/slow.log
      --long_query_time=2
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-u${DB_USERNAME}", "-p${DB_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - hk-network

  redis:
    image: redis:7-alpine
    container_name: hk-redis-prod
    restart: always
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD}
      --appendonly yes
      --maxmemory 512mb
      --maxmemory-policy allkeys-lru
      --save 900 1
      --save 300 10
      --save 60 10000
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - hk-network

  admin:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: huakang/admin:1.0.0
    container_name: hk-admin-prod
    restart: always
    environment:
      SERVICE_TYPE: admin
      SPRING_PROFILES_ACTIVE: prod
      JVM_OPTS: "-Xms512m -Xmx1024m"
      
      # 数据库配置
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: ${DB_NAME}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      
      # Redis配置
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      
      # JWT配置
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRATION: ${JWT_EXPIRATION:-7200000}
      
      # 阿里云OSS配置
      OSS_ENDPOINT: ${OSS_ENDPOINT}
      OSS_ACCESS_KEY_ID: ${OSS_ACCESS_KEY_ID}
      OSS_ACCESS_KEY_SECRET: ${OSS_ACCESS_KEY_SECRET}
      OSS_BUCKET_NAME: ${OSS_BUCKET_NAME}
      OSS_DOMAIN: ${OSS_DOMAIN}
      OSS_PATH_PREFIX: ${OSS_PATH_PREFIX:-images/}
      
      # 服务器配置
      SERVER_PORT: 8080
    ports:
      - "8080:8080"
    volumes:
      - admin_logs:/app/logs
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    networks:
      - hk-network

  miniapp:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: huakang/miniapp:1.0.0
    container_name: hk-miniapp-prod
    restart: always
    environment:
      SERVICE_TYPE: miniapp
      SPRING_PROFILES_ACTIVE: prod
      JVM_OPTS: "-Xms512m -Xmx1024m"
      
      # 数据库配置
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: ${DB_NAME}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      
      # Redis配置
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      
      # JWT配置
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRATION: ${JWT_EXPIRATION:-7200000}
      
      # 微信小程序配置
      WECHAT_APPID: ${WECHAT_APPID}
      WECHAT_SECRET: ${WECHAT_SECRET}
      
      # 服务器配置
      SERVER_PORT: 8081
    ports:
      - "8081:8081"
    volumes:
      - miniapp_logs:/app/logs
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8081/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    networks:
      - hk-network

volumes:
  mysql_data:
    driver: local
  redis_data:
    driver: local
  admin_logs:
    driver: local
  miniapp_logs:
    driver: local

networks:
  hk-network:
    driver: bridge
