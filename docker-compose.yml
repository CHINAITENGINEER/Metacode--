  #     NODE_ENV: production
  #     DB_HOST: mysql
  #     DB_PORT: 3306
  #     DB_NAME: ${MYSQL_DATABASE:-hk_electronics}
  #     DB_USER: ${MYSQL_USER:-hk}
  #     DB_PASSWORD: ${MYSQL_PASSWORD:-hk123456}
  #     REDIS_HOST: redis
  #     REDIS_PORT: 6379
  #   ports:
  #     - "${BACKEND_PORT:-3000}:3000"
  #   depends_on:
  #     mysql:
  #       condition: service_healthy
  #     redis:
  #       condition: service_healthy

volumes:
  mysql_data:
  redis_data:

