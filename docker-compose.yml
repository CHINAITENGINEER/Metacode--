name: hk-electronics

services:
  mysql:
    image: mysql:8.0
    container_name: hk-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-hk_electronics}
      MYSQL_USER: ${MYSQL_USER:-hk}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-hk123456}
      TZ: Asia/Shanghai
    ports:
      - "${MYSQL_PORT:-3307}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./database_init_enterprise_fixed.sql:/docker-entrypoint-initdb.d/001_init.sql:ro
    command: >
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_unicode_ci
      --default-time-zone=+08:00
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 5s
      timeout: 3s
      retries: 30

  redis:
    image: redis:7-alpine
    container_name: hk-redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    command: ["redis-server", "--appendonly", "yes"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 30

  # backend:
  #   # 你的后端代码落地后再启用这个服务：
  #   # - 放一个 Dockerfile 在项目根目录（或 backend/ 下）
  #   # - 在 .env 里配置 DB/Redis 连接
  #   build:
  #     context: .
  #     dockerfile: Dockerfile
  #   container_name: hk-backend
  #   restart: unless-stopped
